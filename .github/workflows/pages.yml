name: Deploy Pastor Preparation Dashboard to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Build dashboard site
        run: |
          mkdir -p _site
          cp "Pastor Preparation Dashboard.html" _site/index.html
          python3 - <<'PY'
          from pathlib import Path
          p=Path('_site/index.html')
          s=p.read_text()
          marker='<section class="track card">\n<div class="kicker">Track 2</div>\n<h2>Preaching & Teaching</h2>'
          classes='''<section class="track card" id="pastor-preparation-classes">
<div class="kicker">Pastor Preparation Classes</div>
<h2>Custom Self-Directed Ministry Curriculum</h2>
<p class="meta">Eleven structured classes combining free online instruction, Scripture, linked recommended books/resources, and practical ministry assignments. Whole-Bible reading remains separate.</p>
<div class="module"><div class="label">Class 1</div><h3>Bible & Hermeneutics</h3><p><strong>Description:</strong> Learn faithful interpretation through genre, context, structure, biblical theology, and canonical connections.</p><p><strong>Free course/video:</strong> <a href="https://bibleproject.com/classroom/introduction-to-the-hebrew-bible/" target="_blank">BibleProject — Introduction to the Hebrew Bible</a>.</p><p><strong>Books/resources:</strong> <a href="https://www.zondervan.com/9780310109174/grasping-gods-word/" target="_blank"><em>Grasping God's Word</em> — Duvall & Hays</a>; <a href="https://zondervanacademic.com/products/how-to-read-the-bible-for-all-its-worth-4th" target="_blank"><em>How to Read the Bible for All Its Worth</em> — Fee & Stuart</a>.</p><p><strong>Scripture:</strong> Neh. 8:1–8; Luke 24:25–27; Acts 17:10–12; 2 Tim. 2:15.</p><p><strong>Assignment:</strong> Exegete an epistle paragraph and narrative passage and produce a 2–3 page interpretation report.</p><label><input class="task" id="class-hermeneutics" type="checkbox"> Class complete</label></div>
<div class="module"><div class="label">Class 2</div><h3>Systematic Theology</h3><p><strong>Description:</strong> Build an organized doctrinal framework covering the major loci of Christian theology.</p><p><strong>Free course/video:</strong> <a href="https://www.biblicaltraining.org/theology" target="_blank">BiblicalTraining — Theology courses</a>.</p><p><strong>Books/resources:</strong> <a href="https://books.google.com/books?q=Christian+Theology+Millard+Erickson" target="_blank"><em>Christian Theology</em> — Millard Erickson</a>; <a href="https://books.google.com/books?q=Systematic+Theology+Wayne+Grudem" target="_blank"><em>Systematic Theology</em> — Wayne Grudem</a>; <a href="https://www.thegospelcoalition.org/essay/systematic-theology/" target="_blank">TGC — Systematic Theology overview</a>.</p><p><strong>Assignment:</strong> Build a pastor-level statement of faith with key texts, major disagreements, conclusions, and pastoral implications.</p><label><input class="task" id="class-theology" type="checkbox"> Class complete</label></div>
<div class="module"><div class="label">Class 3</div><h3>Church History</h3><p><strong>Description:</strong> Trace the Church from the apostolic era through the early councils, medieval period, Reformation, evangelical revivals, modern missions, and Pentecostal and charismatic movements. Evaluate historical claims under Scripture while representing each tradition fairly.</p><p><strong>Free courses/videos:</strong> <a href="https://www.thegospelcoalition.org/course/before-nicea/" target="_blank">TGC — Before Nicaea</a>; <a href="https://www.thegospelcoalition.org/course/history-of-the-middle-ages/" target="_blank">TGC — History of the Middle Ages</a>; <a href="https://www.thegospelcoalition.org/course/19th-20th-century-church-history/" target="_blank">TGC — 19th–20th Century Church History</a>.</p><p><strong>Books/resources:</strong> <a href="https://books.google.com/books?q=Church+History+in+Plain+Language+Bruce+Shelley" target="_blank"><em>Church History in Plain Language</em> — Bruce Shelley</a>; <a href="https://books.google.com/books?q=The+Story+of+Christianity+Justo+Gonzalez" target="_blank"><em>The Story of Christianity</em> — Justo González</a>; <a href="https://books.google.com/books?q=The+Century+of+the+Holy+Spirit+Vinson+Synan" target="_blank"><em>The Century of the Holy Spirit</em> — Vinson Synan</a>; <a href="https://ifphc.org/" target="_blank">Flower Pentecostal Heritage Center</a>.</p><p><strong>Assignment:</strong> Build an annotated timeline covering six major eras. Write short evaluations of the canon, early creeds, East–West Schism, Reformation, evangelical revivals, Azusa Street, and the Oneness controversy, then review your conclusions with a mature pastor.</p><label><input class="task" id="class-history" type="checkbox"> Class complete</label></div>
<div class="module"><div class="label">Class 4</div><h3>Preaching & Teaching</h3><p><strong>Description:</strong> Develop text-driven, Christ-centered, Spirit-dependent preaching.</p><p><strong>Free course/video:</strong> <a href="https://www.thegospelcoalition.org/course/basics-of-preaching/" target="_blank">TGC — Basics of Preaching</a>; <a href="https://www.desiringgod.org/messages/how-to-preach-in-the-power-of-the-spirit" target="_blank">Desiring God — How to Preach in the Power of the Spirit</a>.</p><p><strong>Books/resources:</strong> <a href="https://books.google.com/books?q=Biblical+Preaching+Haddon+Robinson" target="_blank"><em>Biblical Preaching</em> — Haddon Robinson</a>; <a href="https://books.google.com/books?q=Christ-Centered+Preaching+Bryan+Chapell" target="_blank"><em>Christ-Centered Preaching</em> — Bryan Chapell</a>; <a href="https://www.thegospelcoalition.org/course/christ-centered-preaching/" target="_blank">TGC — Christ-Centered Preaching course</a>.</p><p><strong>Assignment:</strong> Analyze 12 sermons, prepare 12 short expositions, and deliver four recorded 20-minute sermons from different genres.</p><label><input class="task" id="class-preaching" type="checkbox"> Class complete</label></div>
<div class="module"><div class="label">Class 5</div><h3>Holy Spirit & Spiritual Gifts</h3><p><strong>Description:</strong> Study the Spirit's person and work, empowerment, gifts, discernment, order, and responsible charismatic practice.</p><p><strong>Free course/video:</strong> <a href="https://www.thegospelcoalition.org/course/the-work-of-the-spirit/" target="_blank">TGC — The Work of the Spirit</a>.</p><p><strong>Books/resources:</strong> <a href="https://zondervanacademic.com/products/practicing-the-power" target="_blank"><em>Practicing the Power</em> — Sam Storms</a>; <a href="https://books.google.com/books?q=Showing+the+Spirit+D.A.+Carson" target="_blank"><em>Showing the Spirit</em> — D. A. Carson</a>; <a href="https://www.thegospelcoalition.org/course/the-work-of-the-spirit/" target="_blank">TGC Spirit course resources</a>.</p><p><strong>Assignment:</strong> Write Scripture-defended ministry guidelines for prophecy, tongues, healing prayer, discernment, correction, safety, and oversight.</p><label><input class="task" id="class-spirit" type="checkbox"> Class complete</label></div>
<div class="module"><div class="label">Class 6</div><h3>Pastoral Care & Shepherding</h3><p><strong>Description:</strong> Learn shepherding, visitation, grief care, counseling boundaries, crisis response, referral, and prayer.</p><p><strong>Free course/video:</strong> <a href="https://www.thegospelcoalition.org/course/the-pastor-as-shepherd/" target="_blank">TGC — The Pastor as Shepherd</a>.</p><p><strong>Books/resources:</strong> <a href="https://books.google.com/books?q=The+Shepherd+Leader+Timothy+Witmer" target="_blank"><em>The Shepherd Leader</em> — Timothy Witmer</a>; <a href="https://books.google.com/books?q=The+Reformed+Pastor+Richard+Baxter" target="_blank"><em>The Reformed Pastor</em> — Richard Baxter</a>; <a href="https://www.thegospelcoalition.org/course/the-pastor-as-shepherd/" target="_blank">Shepherding course resources</a>.</p><p><strong>Assignment:</strong> Under church supervision, observe pastoral care and write response plans for grief, hospitalization, conflict, suicidal statements, abuse, domestic violence, and referral situations.</p><label><input class="task" id="class-care" type="checkbox"> Class complete</label></div>
<div class="module"><div class="label">Class 7</div><h3>Church Leadership & Eldership</h3><p><strong>Description:</strong> Study qualifications, elders, deacons, accountability, leadership development, conflict, and discipline.</p><p><strong>Free course/video:</strong> <a href="https://www.thegospelcoalition.org/course/basics-of-church-eldership/" target="_blank">TGC — Basics of Church Eldership</a>.</p><p><strong>Books/resources:</strong> <a href="https://www.biblicaleldership.com/" target="_blank"><em>Biblical Eldership</em> — Alexander Strauch</a>; <a href="https://books.google.com/books?q=Church+Elders+Jeramie+Rinne" target="_blank"><em>Church Elders</em> — Jeramie Rinne</a>; <a href="https://books.google.com/books?q=Spiritual+Leadership+J+Oswald+Sanders" target="_blank"><em>Spiritual Leadership</em> — J. Oswald Sanders</a>; <a href="https://www.9marks.org/" target="_blank">9Marks church leadership resources</a>.</p><p><strong>Assignment:</strong> Create a governance diagram, elder-development pathway, and six leadership case-study responses.</p><label><input class="task" id="class-leadership" type="checkbox"> Class complete</label></div>
<div class="module"><div class="label">Class 8</div><h3>Church Administration</h3><p><strong>Description:</strong> Learn budgeting, controls, hiring, volunteers, records, policies, facilities, insurance, safeguarding, and legal awareness.</p><p><strong>Free course/video:</strong> <a href="https://www.thegospelcoalition.org/course/church-administration/" target="_blank">TGC — Church Administration</a>.</p><p><strong>Books/resources:</strong> <a href="https://books.google.com/books?q=Church+Administration+Handbook+Bruce+Powers" target="_blank"><em>Church Administration Handbook</em> — Bruce Powers</a>; <a href="https://www.irs.gov/charities-non-profits/churches-religious-organizations" target="_blank">IRS — Churches & Religious Organizations</a>; <a href="https://www.churchlawandtax.com/" target="_blank">Church Law & Tax</a>.</p><p><strong>Assignment:</strong> Build a mock annual budget, approval matrix, expense controls, volunteer onboarding checklist, incident report, child-safety workflow, and meeting agenda.</p><label><input class="task" id="class-administration" type="checkbox"> Class complete</label></div>
<div class="module"><div class="label">Class 9</div><h3>Discipleship, Evangelism & Missions</h3><p><strong>Description:</strong> Learn gospel proclamation, disciple-making, leader development, and local/global mission.</p><p><strong>Free course/video:</strong> <a href="https://www.thegospelcoalition.org/course/making-disciples/" target="_blank">TGC — Making Disciples</a>; <a href="https://www.thegospelcoalition.org/course/advancing-the-gospel-deep-and-wide/" target="_blank">TGC — Advancing the Gospel Deep and Wide</a>.</p><p><strong>Books/resources:</strong> <a href="https://books.google.com/books/about/The_Master_Plan_of_Evangelism.html?id=L-OgPwAACAAJ" target="_blank"><em>The Master Plan of Evangelism</em> — Robert Coleman</a>; <a href="https://books.google.com/books?q=The+Trellis+and+the+Vine+Colin+Marshall+Tony+Payne" target="_blank"><em>The Trellis and the Vine</em> — Marshall & Payne</a>; <a href="https://www.lausanne.org/" target="_blank">Lausanne Movement missions resources</a>.</p><p><strong>Assignment:</strong> Design a disciple-making pathway, disciple someone under church accountability, and develop a written evangelism/missions strategy.</p><label><input class="task" id="class-discipleship" type="checkbox"> Class complete</label></div>
<div class="module"><div class="label">Class 10</div><h3>Church Planting</h3><p><strong>Description:</strong> Study calling, contextualization, launch teams, discipleship, finances, leadership, multiplication, and healthy measures of success.</p><p><strong>Free course/video:</strong> <a href="https://www.thegospelcoalition.org/course/gospel-rich-church-planting/" target="_blank">TGC — Gospel-Rich Church Planting</a>; <a href="https://www.thegospelcoalition.org/course/motive-church-planting/" target="_blank">TGC — Motive for Church Planting</a>.</p><p><strong>Books/resources:</strong> <a href="https://books.google.com/books?q=Church+Planting+Is+for+Wimps+Mike+McKinley" target="_blank"><em>Church Planting Is for Wimps</em> — Mike McKinley</a>; <a href="https://books.google.com/books?q=Planting+Missional+Churches+Ed+Stetzer+Daniel+Im" target="_blank"><em>Planting Missional Churches</em> — Stetzer & Im</a>.</p><p><strong>Assignment:</strong> Complete community exegesis and an Awaken Life Church readiness dossier, then have mature pastors critique it.</p><label><input class="task" id="class-planting" type="checkbox"> Class complete</label></div>
<div class="module"><div class="label">Class 11</div><h3>Pastoral Ethics & Safeguarding</h3><p><strong>Description:</strong> Develop integrity and sound boundaries involving power, confidentiality, sexuality, money, counseling, children, vulnerable people, abuse, reporting, and accountability.</p><p><strong>Free course/video:</strong> <a href="https://www.thegospelcoalition.org/course/watch-your-life/" target="_blank">TGC — Watch Your Life</a>; <a href="https://www.thegospelcoalition.org/course/ethics-making-biblical-decisions/" target="_blank">TGC — Ethics: Making Biblical Decisions</a>.</p><p><strong>Books/resources:</strong> <a href="https://books.google.com/books?q=The+Pastor%27s+Soul+Brian+Croft+Jim+Savastio" target="_blank"><em>The Pastor's Soul</em> — Croft & Savastio</a>; <a href="https://www.childwelfare.gov/resources/clergy-mandated-reporters-child-abuse-and-neglect/" target="_blank">Child Welfare Information Gateway — Clergy & mandated reporting</a>; <a href="https://www.churchlawandtax.com/" target="_blank">Church Law & Tax safeguarding/legal resources</a>.</p><p><strong>Assignment:</strong> Draft a pastoral code of ethics and safeguarding policy and have qualified church leaders and appropriate professionals review it before real-world adoption.</p><label><input class="task" id="class-ethics" type="checkbox"> Class complete</label></div>
</section>

'''
          if marker not in s:
              raise SystemExit('Track 2 marker not found')
          s=s.replace(marker,classes+marker,1)
          p.write_text(s)
          PY
          touch _site/.nojekyll
      - name: Upload dashboard
        uses: actions/upload-pages-artifact@v3
        with:
          path: './_site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
